<!doctype html> <!--관용적으로 html을 나타내는 태그-->
<html> <!--모든 태그를 하나로 묶는 태그-->
<head> <!--본문을 설명하는 태그-->
    <title>WEB1 - HTML</title> <!--파일명-->
    <meta charset="utf-8"> <!--웹 브라우저 읽기-->
</head>
<body> <!--본문을 묶는 태그-->
    <h1><a href="index.html">WEB</a></h1>
    <ol> <!--목차--> <!--자동으로 숫자를 새겨줌-->
        <li><a href="1.html">HTML</a></li> <!--단독으로 쓸 수 없음, <ol> 부모 태그 필요--> <!--목차 안에 개별로 나타낸다고 생각하면 좋음-->
        <li><a href="2.html">CSS</a></li>
        <li><a href="3.html">JavaScript</a></li>
    </ol>
    <h2>HTML이란 무엇인가?</h2> <!--제목-->
    <a href="https://www.w3.org/TR/html4/" target="_blank" title="html5 specification">Hypertexet Markup Language (HTML)</a> is the standard markup language for <strong>creating <u>web</u> pages</strong> and web applications. 
    <!--a 링크, 새 탭으로 열기, 설명 툴--> <!--u 밑줄--> <!--s 굵게-->
    <p style="margin-top:45px;"></p> <!--위 요소랑 떨어지는 간격, css 태그-->
    <br> <!--간격-->
    <p></p> <!--간격--> <!--어디부터 어디까지 영역 표시-->
    <img src="coding.jpg" width="450"> <!--이미지-->
</body>
</html>
