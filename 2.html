    <h2>CSS이란 무엇인가?</h2> <!--제목-->
    <P>CSS의 C가 Cascading[1]의 약자인데, 이는 상위 요소의 스타일 속성을 자손 요소들에게 상속시켜 주는 모습이 DOM 트리 구조에서 마치 폭포수처럼 내려가는 모습을 닮았기 때문이다. 다만 예외로 마진, 패딩, 보더 등의 박스 모델 관련 속성은 상속되지 않는다. 물론 inherit값을 줘서 강제로 상속시킬 순 있다.</P>
    <p style="margin-top:45px;"></p> <!--위 요소랑 떨어지는 간격, css 태그-->
    <br> <!--간격-->
    <p></p> <!--간격--> <!--어디부터 어디까지 영역 표시-->
    <img src="coding.jpg" width="450"> <!--이미지-->
